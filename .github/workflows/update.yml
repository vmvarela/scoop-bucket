name: Update Scoop Bucket

on:
  # Recovery sync: a missed dispatch converges on the next scheduled run.
  schedule:
    - cron: "57 5 * * *"
  repository_dispatch:
    types: [update-sql-pipe, update-damas]
  workflow_dispatch:
    inputs:
      package:
        description: "Package whose release triggered the rebuild"
        required: true
        default: sql-pipe
        type: choice
        options:
          - sql-pipe
          - damas
      version:
        description: "Release version without v; leave empty to use latest stable"
        required: false
      force:
        description: "Rewrite the manifest even when the state already matches the release"
        required: false
        default: false
        type: boolean

# Publisher contract (docs/receivers.md in vmvarela/package-distribution).
env:
  PACKAGE_DISTRIBUTION_SHA: 107043db57c140d803d7d749895ace2f72d96216

concurrency:
  group: bucket
  cancel-in-progress: false

jobs:
  build-and-commit:
    name: Regenerate the Scoop manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out package-distribution
        uses: actions/checkout@v6
        with:
          repository: vmvarela/package-distribution
          ref: ${{ env.PACKAGE_DISTRIBUTION_SHA }}
          path: publisher
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve target and version
        id: vars
        # A scheduled run has no package event; the publish step walks the catalog instead.
        if: github.event_name != 'schedule'
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "${EVENT_ACTION:-${INPUT_PACKAGE:-}}" in
            update-sql-pipe|sql-pipe) target="sql-pipe" ;;
            update-damas|damas) target="damas" ;;
            *) echo "::error::Unknown package update event."; exit 1 ;;
          esac

          catalog="publisher/catalog/${target}.json"
          repo="$(jq -r '.repo' "$catalog")"
          version="${REQUESTED_VERSION:-}"
          version="${version#v}"
          if [[ -z "$version" ]]; then
            version="$(gh api "repos/${repo}/releases/latest" --jq .tag_name)"
            version="${version#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a stable release version for ${target}: ${version}"
            exit 1
          fi

          {
            echo "target=${target}"
            echo "catalog=${catalog}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the manifest
        id: publish
        shell: bash
        env:
          TARGET: ${{ steps.vars.outputs.target }}
          VERSION: ${{ steps.vars.outputs.version }}
          FORCE: ${{ github.event.inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=""
          if [ "${FORCE:-false}" = "true" ]; then extra="--force"; fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            targets="$(for f in publisher/catalog/*.json; do
              if jq -e '.channels.scoop' "$f" >/dev/null 2>&1; then basename "$f" .json; fi
            done)"
          else
            targets="${TARGET}"
          fi

          changed="false"
          state="state"
          for target in ${targets}; do
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              repo="$(jq -r '.repo' "publisher/catalog/${target}.json")"
              version="$(gh api "repos/${repo}/releases/latest" --jq .tag_name)"
              version="${version#v}"
              if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Not a stable release version for ${target}: ${version}"
                exit 1
              fi
            else
              version="${VERSION}"
            fi

            # One output per package: the publisher refuses a non-empty --out, and the chained
            # state is what carries the packages already processed.
            out="tree-${target}"
            node publisher/scripts/scoop-publish.mjs \
              --catalog "publisher/catalog/${target}.json" \
              --version "${version}" \
              --source github \
              --out "${out}" \
              --state "${state}" ${extra}

            if [ -f "${out}/bucket/${target}.json" ]; then
              mkdir -p bucket
              cp "${out}/bucket/${target}.json" "bucket/${target}.json"
              echo "Rewrote bucket/${target}.json for ${version}."
              changed="true"
              state="${out}.state"
            else
              echo "No change for ${target} ${version}."
            fi
          done

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Record durable state
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          STATE: ${{ steps.publish.outputs.state }}
        run: |
          set -euo pipefail
          rsync -a --delete "${STATE}/" state/
          git add bucket state
          if git diff --cached --quiet; then
            echo "Manifest and state already current."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: reconcile the manifests with the releases"
          git push origin HEAD:main
